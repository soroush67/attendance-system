# Application stack only. The release overlay supplied by Jenkins pins the tag.
name: attendance
services:
  web:
    image: docker-hosted.hamainsurance.net/attendance-web:develop
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DEVICE_FORMAT: ${DEVICE_FORMAT:-auto}
      DEVICE_TIMEZONE: ${DEVICE_TIMEZONE:-Asia/Tehran}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
    volumes:
      - uploads:/data/uploads
    security_opt: [no-new-privileges:true]
    networks: [internal]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

networks:
  internal:
    external: true
    name: attendance_internal
volumes:
  uploads:
    external: true
    name: attendance_uploads

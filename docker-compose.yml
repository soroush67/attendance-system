name: attendance
services:
  db:
    image: docker-hosted.hamainsurance.net/postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Tehran
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    networks: [internal]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  web:
    build:
      context: ./app
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://nexus.hamainsurance.net/repository/py-proxy/simple}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DEVICE_FORMAT: ${DEVICE_FORMAT:-auto}
      DEVICE_TIMEZONE: ${DEVICE_TIMEZONE:-Asia/Tehran}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
    volumes:
      - uploads:/data/uploads
      - ./data/initial-import:/imports:ro
    depends_on:
      db: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    networks: [internal]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  backup:
    image: docker-hosted.hamainsurance.net/postgres:17.6-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-attendance}
      PGUSER: ${POSTGRES_USER:-attendance}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backups:/backups
      - ./ops/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

networks:
  internal:
    driver: bridge
volumes:
  postgres_data:
  uploads:
  backups:
